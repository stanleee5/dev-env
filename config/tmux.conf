# Default C-b prefix. Uncomment to use ` as prefix instead.
# unbind C-b
# set -g prefix `
# bind ` send-prefix

# Prefer zsh inside tmux sessions. The @@ZSH_BIN@@ placeholder is
# rewritten by scripts/install_tmux.sh to the zsh binary detected at
# install time (command -v zsh), so source-installed zsh is honored.
set-option -g default-shell @@ZSH_BIN@@
set-option -g default-command @@ZSH_BIN@@

# Pane border styling
set -g pane-border-style fg='#742727',bg=black
set -g pane-active-border-style fg=red,bg=black

# Status bar styling is owned entirely by tmux-powerkit (see the TPM block at
# the bottom): it overwrites status-style, status-justify, status-left/right and
# their lengths when `run tpm` executes. Set the look via @powerkit_theme rather
# than with status-* options here, which would be silently discarded.

# Vi mode settings
set-window-option -g mode-keys vi

# VIM-LIKE COPY MODE
bind v copy-mode
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Y send-keys -X copy-selection-and-cancel

# tmux 내부에서 발생한 OSC 52를 외부 터미널까지 통과시킴
set -g set-clipboard on

# True color (24-bit) support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*:Ms=\\E]52;c;%p2%s\\7"
set -as terminal-features ",*:clipboard"

set -g history-limit 50000

# ----- TPM (Tmux Plugin Manager) + plugins -----
# TPM defaults to ~/.tmux/plugins; we relocate it under XDG so dotfiles stay
# inside ~/.config (which maps to /workspace/.config in the dev image).
# The @@TMUX_PLUGIN_PATH@@ placeholder is rewritten by scripts/install_tmux.sh
# to an absolute path. Tilde would not survive: tmux's `set-environment` does
# not expand ~, and TPM's bash helpers concatenate the value verbatim, so the
# leading ~ would never be expanded and plugin lookups would fail.
# scripts/install_tmux.sh also clones TPM and the plugins listed below at
# build/install time so they work without an interactive `prefix + I`.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '@@TMUX_PLUGIN_PATH@@/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @powerkit_plugins "datetime,git,hostname"
set -g @powerkit_plugin_datetime_format "%m-%d %H:%M"
# powerkit only ships day/night/storm for tokyo-night ("moon" is a tokyonight
# *nvim* variant). An unknown variant is not an error -- powerkit silently falls
# back to its default theme (catppuccin/mocha), so a typo here looks like the
# theme setting was ignored. "storm" is the closest match to moon.
set -g @powerkit_theme "tokyo-night"
set -g @powerkit_theme_variant "storm"
# powerkit defaults the status bar to the top and sets status-position itself.
# `run` below is asynchronous, so a plain `set -g status-position bottom` after
# it would be applied first and then overwritten -- it has to be set here, as a
# powerkit option, to win.
set -g @powerkit_status_position "bottom"

run '@@TMUX_PLUGIN_PATH@@/tpm/tpm'
set -g window-style 'default'
set -g window-active-style 'default'
